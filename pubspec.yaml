name: allnimall
description: Allnimall application.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.0.1+2

environment:
  sdk: ">=2.12.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  auto_size_text: 3.0.0
  built_collection: 5.1.1
  built_value: ^8.9.5
  cached_network_image: ^3.3.1
  cloud_firestore: ^4.15.8
  cloud_firestore_platform_interface: ^6.1.9
  cloud_firestore_web: ^3.10.8
  cloud_functions: ^4.6.8
  cloud_functions_platform_interface: ^5.5.19
  cloud_functions_web: ^4.7.2
  collection: ^1.18.0
  easy_debounce: ^2.0.3
  file_picker: ^8.0.0+1
  firebase_auth: ^4.17.8
  firebase_auth_platform_interface: ^7.1.8
  firebase_auth_web: ^5.9.8
  firebase_core: ^2.27.0
  firebase_core_platform_interface: ^5.4.2
  firebase_core_web: ^2.11.5
  firebase_messaging: ^14.7.19
  firebase_messaging_platform_interface: ^4.5.27
  firebase_messaging_web: ^3.6.8
  firebase_storage: ^11.6.9
  firebase_storage_platform_interface: ^5.1.12
  firebase_storage_web: ^3.7.3
  flutter_datetime_picker: 1.5.1
  flutter_google_places: 0.3.0
  flutter_html: ^3.0.0-beta.2
  flutter_rating_bar: 4.0.1
  flutter_spinkit: ^5.2.1
  font_awesome_flutter: ^10.8.0
  geolocator: ^11.1.0
  geolocator_android: ^4.6.1
  geolocator_apple: ^2.3.9
  geolocator_platform_interface: ^4.2.4
  geolocator_web: ^3.0.0
  go_router: ^14.2.3
  google_fonts: ^4.0.4
  google_maps: ^6.3.0
  google_maps_flutter: ^2.5.3
  google_maps_flutter_platform_interface: ^2.9.0
  google_maps_flutter_web: ^0.5.4+3
  google_sign_in: ^6.2.1
  google_sign_in_android: ^6.1.23
  google_sign_in_ios: ^5.7.6
  google_sign_in_platform_interface: ^2.4.5
  google_sign_in_web: ^0.12.3+2
  image_picker: ^1.0.8
  intl: ^0.18.1
  json_path: ^0.7.6
  json_serializable: ^6.8.0
  lottie: ^3.0.0
  mime_type: ^1.0.1
  page_transition: ^2.1.0
  plugin_platform_interface: ^2.1.8
  rxdart: 0.27.4
  share_plus: ^7.2.2
  shared_preferences: ^2.2.3
  sign_in_with_apple: ^5.0.0
  sign_in_with_apple_platform_interface: 1.0.0
  sign_in_with_apple_web: 1.0.1
  table_calendar: ^3.0.9
  timeago: ^3.7.1
  url_launcher: ^6.3.0


  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.0

dependency_overrides:
  provider: 6.0.3
  rxdart: 0.27.5

dev_dependencies:
  build_runner: ^2.4.9
  built_value_generator: ^8.9.2
  flutter_launcher_icons: ^0.13.1

  flutter_test:
    sdk: flutter


flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: 'assets/images/app_launcher_icon.png'


# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/fonts/
    - assets/images/
    - assets/videos/
    - assets/audios/
    - assets/lottie_animations/
    - assets/rive_animations/
    - assets/pdfs/
  fonts:
    - family: 'RockoUltra'
      fonts:
        - asset: assets/fonts/RockoUltraFLF.ttf
          weight: 500
        - asset: assets/fonts/RockoUltraFLF-Bold.ttf
          weight: 700


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/assets-and-images/#resolution-aware.

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/assets-and-images/#from-packages

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/custom-fonts/#from-packages
